# Build the Astro site (apps/web, through Turborepo), run the mechanical checker, and publish apps/web/dist/ to GitHub Pages.
# Repository must be the user site gonnzalofr.github.io (no `base` in astro.config.mjs),
# with Settings -> Pages -> Source set to "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm at the version in package.json's "packageManager" field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo runs build, then tooling/check-site/check_site.py on apps/web/dist (with the runner's python3);
      # the checker exits 1 on any ERROR, which fails the job before anything is uploaded
      - run: pnpm check
        env:
          # optional repository secret: a regex of private strings (your own phone numbers) that must never ship
          CHECK_PRIVATE: ${{ secrets.CHECK_PRIVATE }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
