# Build the Astro site, run the mechanical checker, and publish dist/ to GitHub Pages.
# Repository must be the user site gonnzalofr.github.io (no `base` in astro.config.mjs),
# with Settings -> Pages -> Source set to "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - run: npm run build

      # exits 1 on any ERROR, which fails the job before anything is uploaded
      - run: python tools/check_site.py dist
        env:
          # optional repository secret: a regex of private strings (your own phone numbers) that must never ship
          CHECK_PRIVATE: ${{ secrets.CHECK_PRIVATE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
